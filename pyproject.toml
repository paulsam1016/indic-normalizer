[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indic-normalizer"
version = "0.1.0"
description = "Meaning-preserving text normalization for Indic-script ASR scoring (WER/CER), Malayalam-first."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Paul Sam Anto", email = "paulsamanto1016@gmail.com" }]
keywords = ["nlp", "asr", "wer", "cer", "normalization", "malayalam", "indic", "text"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Linguistic",
]
# indic-nlp-library is a hard dependency: the Malayalam path relies on it for the full
# chillu / two-part-vowel / visarga canonicalization (there is no stdlib fallback).
dependencies = ["indic-nlp-library>=0.92"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/paulsam1016/indic-normalizer"
Source = "https://github.com/paulsam1016/indic-normalizer"

[tool.hatch.build.targets.wheel]
packages = ["src/indic_normalizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
