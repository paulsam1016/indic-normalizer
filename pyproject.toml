[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indic-normalizer"
version = "0.1.0"
description = "Meaning-preserving text normalization for Indic-script ASR scoring (WER/CER), Malayalam-first."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Paul Samanto", email = "paulsamanto1016@gmail.com" }]
keywords = ["nlp", "asr", "wer", "cer", "normalization", "malayalam", "indic", "text"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Linguistic",
]
# Core has ZERO required deps — pure stdlib, so it drops into any project cheaply.
dependencies = []

[project.optional-dependencies]
# The Malayalam path uses indic-nlp-library when present for the fullest chillu /
# two-part-vowel / visarga canonicalization; a pure-stdlib fallback runs without it.
indic = ["indic-nlp-library>=0.92"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/paulsam1016/indic-normalizer"
Source = "https://github.com/paulsam1016/indic-normalizer"

[tool.hatch.build.targets.wheel]
packages = ["src/indic_normalizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
