[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indic-normalizer"
version = "0.1.0"
description = "Meaning-preserving text normalization for Indic-script ASR scoring (WER/CER), Malayalam-first."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Paul Sam Anto", email = "paulsamanto1016@gmail.com" }]
keywords = ["nlp", "asr", "wer", "cer", "normalization", "malayalam", "indic", "text"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Linguistic",
]
# indic-nlp-library is a hard dependency: the Malayalam path relies on it for the full
# chillu / two-part-vowel / visarga canonicalization (there is no stdlib fallback).
dependencies = ["indic-nlp-library>=0.92"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# indic_normalizer.digits audio scoring (RNN-T/CTC choice of number readings). The text-only
# parts of the digits module (find / candidates / verbalize / stats) need nothing extra.
# torch + NeMo: the CUDA build of torch is the APPLICATION's choice (its index, its CUDA version) —
# this library deliberately declares no torch index, so it never overrides the app's (a uv project
# depending on this package would otherwise be pulled to whatever CUDA this file named).
digits = [
    "numpy>=1.22",
    "PyYAML>=6",
    "soundfile>=0.12",
    "torch==2.12.1",
    "nemo_toolkit[asr]==3.0.0",
    ]

[project.scripts]
indic-digits = "indic_normalizer.digits.cli:main"

[project.urls]
Homepage = "https://github.com/paulsam1016/indic-normalizer"
Source = "https://github.com/paulsam1016/indic-normalizer"

[tool.hatch.build.targets.wheel]
packages = ["src/indic_normalizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
